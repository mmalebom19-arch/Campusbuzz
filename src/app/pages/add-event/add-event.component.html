<div class="container">
  <h2>Add New Event</h2>
  <div class="form-group">
    <label>Event Title:</label>
    <input type="text" [(ngModel)]="event.eventTitle" />
  </div>
  <div class="form-group">
    <label>Location:</label>
    <input type="text" [(ngModel)]="event.location" />
  </div>
  <div class="form-group">
    <label>Ticket Price:</label>
    <input type="text" [(ngModel)]="event.ticketPrice" />
  </div>
  <button class="btn-submit" (click)="submitEvent()" [disabled]="!isFormValid()">Submit</button>
  <button class="btn-cancel" (click)="cancel()">Cancel</button>
</div>
